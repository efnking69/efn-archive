<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOADING BRAIN CELLS...</title>
<style>
  :root {
    --neon-pink: #ff00ff;
    --slime-green: #32cd32;
    --void: #000000;
  }

  body {
    background-color: var(--void);
    color: var(--slime-green);
    font-family: "Comic Sans MS", "Comic Sans", cursive; /* The ultimate 'stupid' font */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    cursor: wait; /* Makes the user think it's always loading */
  }

  .chaos-container {
    border: 5px dotted var(--neon-pink);
    padding: 50px;
    background: repeating-linear-gradient(45deg, #111, #111 10px, #222 10px, #222 20px);
    transform: rotate(-2deg);
  }

  h1 {
    font-size: 3rem;
    animation: wobble 0.1s infinite;
    text-shadow: 3px 3px var(--neon-pink);
  }

  .spinning-shoe {
    width: 200px;
    margin: 20px;
    animation: spin 0.5s linear infinite;
    filter: hue-rotate(90deg);
  }

  .status-text {
    font-size: 1.5rem;
    color: yellow;
    background: blue;
    padding: 5px;
  }

  marquee {
    width: 100%;
    background: var(--neon-pink);
    color: white;
    font-weight: bold;
    position: absolute;
    top: 0;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes wobble {
    0% { transform: translate(0,0) rotate(0); }
    50% { transform: translate(5px, 2px) rotate(2deg); }
    100% { transform: translate(-5px, -2px) rotate(-2deg); }
  }
</style>
</head>
<body>

<marquee scrollamount="20">⚠️ WARNING: EXTREME STUPIDITY DETECTED ⚠️ DONT CLICK ANYTHING ⚠️ ERROR 404 BRAIN NOT FOUND ⚠️</marquee>

<div class="chaos-container">
    <h1>PIXEL WORLD HAX 9000</h1>
    
    <img src="https://www.pngall.com/wp-content/uploads/2/Running-Shoes-PNG-Free-Download.png" class="spinning-shoe" alt="SENSELESS SPINNING SHOE">
    
    <p class="status-text">CURRENT STATUS: EATING CRAYONS...</p>
    <p style="margin-top: 20px;">ETA: 9999 YEARS</p>
</div>

<script>
    // Changes the title to be annoying
    const messages = ["HELLO?", "ARE YOU LOST?", "BUY MORE RAM", "PLZ WAIT"];
    setInterval(() => {
        document.title = messages[Math.floor(Math.random() * messages.length)];
    }, 500);

    // Randomly moves the container slightly to make it hard to look at
    setInterval(() => {
        const container = document.querySelector('.chaos-container');
        container.style.borderColor = '#' + Math.floor(Math.random()*16777215).toString(16);
    }, 100);
</script>

</body>
</html>
