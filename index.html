<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFN Archive | Pixel Worlds Tools</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCM-ySTXgy37zVUMB2vy4ZJQ3MWlDD5g4E",
            authDomain: "efn-archive.firebaseapp.com",
            projectId: "efn-archive",
            storageBucket: "efn-archive.firebasestorage.app",
            messagingSenderId: "1073610968306",
            appId: "1:1073610968306:web:72e03b6f43decbb636546b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- AUTH LOGIC ---
        window.handleAuthError = (err, elementId) => {
            const el = document.getElementById(elementId);
            el.style.display = "block";
            if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                el.innerText = "Invalid email or password.";
            } else if (err.code === 'auth/email-already-in-use') {
                el.innerText = "This email is already registered.";
            } else {
                el.innerText = "An error occurred. Try again.";
            }
        };

        window.login = async () => {
            const email = document.getElementById('log-email').value;
            const pass = document.getElementById('log-pass').value;
            const errorEl = document.getElementById('log-error');
            errorEl.style.display = "none";

            try {
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                if (cred.user.emailVerified) { location.reload(); }
                else { 
                    errorEl.style.display = "block";
                    errorEl.innerText = "Please verify your email first (check spam).";
                }
            } catch (e) { handleAuthError(e, 'log-error'); }
        };

        window.signUp = async () => {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const errorEl = document.getElementById('reg-error');
            errorEl.style.display = "none";

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await sendEmailVerification(cred.user);
                errorEl.style.display = "block";
                errorEl.style.color = "#3ecf8e";
                errorEl.innerText = "Verification sent! Check your inbox/spam.";
            } catch (e) { handleAuthError(e, 'reg-error'); }
        };

        window.logout = () => signOut(auth).then(() => location.reload());

        // --- UI TOGGLES ---
        window.togglePass = (id) => {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        };

        window.switchAuth = (mode) => {
            const loginBox = document.getElementById('login-box');
            const regBox = document.getElementById('reg-box');
            if (mode === 'reg') {
                loginBox.style.display = 'none';
                regBox.style.display = 'block';
            } else {
                regBox.style.display = 'none';
                loginBox.style.display = 'block';
            }
        };

        window.openDetail = (name, status, desc, img, link) => {
            document.getElementById('main-page').style.display = 'none';
            const det = document.getElementById('detail-page');
            det.style.display = 'block';
            document.getElementById('det-title').innerText = name;
            document.getElementById('det-status').innerText = status;
            document.getElementById('det-desc').innerText = desc;
            document.getElementById('det-img').src = img;
            document.getElementById('det-dl').onclick = () => window.open(link, '_blank');
        };

        onAuthStateChanged(auth, (user) => {
            if (user && user.emailVerified) {
                document.getElementById('nav-guest').style.display = 'none';
                document.getElementById('nav-user').style.display = 'flex';
                document.getElementById('user-tag').innerText = user.email.split('@')[0];
                document.querySelectorAll('.lock-ui').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.auth-ui').forEach(el => el.style.display = 'block');
            }
        });
    </script>

    <style>
        :root { --bg: #050505; --card: #0a0a0a; --accent: #5865F2; --border: #151515; --error: #ff4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; }
        
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; }
        
        /* Discord Button */
        .btn-discord-box { background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.85rem; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-discord-box:hover { background: #4752c4; transform: translateY(-2px); }

        /* Profile Menu Fix */
        .profile-container { position: relative; padding-bottom: 20px; margin-bottom: -20px; } /* The bridge */
        .dropdown { position: absolute; top: 100%; right: 0; background: #111; border: 1px solid var(--border); border-radius: 8px; width: 170px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; }
        .profile-container:hover .dropdown { display: block; }
        .dropdown button { width: 100%; padding: 12px; background: none; border: none; color: #888; text-align: left; cursor: pointer; }
        .dropdown button:hover { background: #1a1a1a; color: #fff; }

        .container { max-width: 1100px; margin: 50px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; text-align: center; transition: 0.3s; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .card:hover { border-color: var(--accent); transform: scale(1.02); }

        /* Lowercase specific buttons */
        .btn-low { text-transform: lowercase; }
        .btn-main { background: #fff; color: #000; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-main:hover { background: var(--accent); color: #fff; }
        
        /* Auth Modal Styling */
        #auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .auth-box { width: 360px; background: #0d0d0d; padding: 40px; border-radius: 16px; border: 1px solid var(--border); position: relative; }
        .auth-box h2 { margin-top: 0; letter-spacing: 1px; }
        
        .input-group { position: relative; margin: 15px 0; }
        input { width: 100%; padding: 14px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 0.9rem; }
        .eye-btn { position: absolute; right: 12px; top: 14px; background: none; border: none; color: #444; cursor: pointer; font-size: 1.1rem; }
        
        .error-msg { color: var(--error); font-size: 0.75rem; margin-top: 10px; display: none; font-weight: bold; animation: fadeIn 0.3s ease; }

        /* Detail Page */
        #detail-page { display: none; }
        .detail-grid { display: flex; gap: 40px; margin-top: 30px; flex-wrap: wrap; }
        .detail-info { flex: 2; background: #080808; border-radius: 15px; padding: 35px; border: 1px solid var(--border); }
        .detail-side { flex: 1; background: var(--card); border-radius: 15px; padding: 30px; border: 1px solid var(--border); text-align: center; height: fit-content; }
        .btn-red { background: var(--error); color: #fff; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<nav>
    <div style="font-weight:900; letter-spacing:2px; cursor:pointer" onclick="location.reload()">EFN ARCHIVE</div>
    <div style="display:flex; align-items:center; gap: 20px;">
        <a href="https://discord.gg/QV69upuxbg" target="_blank" class="btn-discord-box">discord server</a>
        <div id="nav-guest">
            <button class="btn-main" onclick="document.getElementById('auth-overlay').style.display='flex'">Login</button>
        </div>
        <div id="nav-user" style="display:none;" class="profile-container">
            <span id="user-tag" style="background:#111; padding:8px 15px; border:1px solid #222; border-radius:20px; font-size:0.8rem"></span>
            <div class="dropdown">
                <button onclick="alert('Coming soon!')">Edit Account</button>
                <button onclick="logout()" style="color:var(--error)">Log Out</button>
            </div>
        </div>
    </div>
</nav>

<div id="main-page" class="container fade-in">
    <h1 style="font-size: 2.5rem; margin-bottom: 40px;">Pixel Worlds Tools</h1>
    <div class="grid">
        <div class="card">
            <img src="https://cdn.discordapp.com/attachments/1495783572735262911/1496170026158260364/image.png?ex=69e8e86b&is=69e796eb&hm=91c64bb8c69318d8c42565b0c38edd3cd55e8446622235632bbf522c5d280782&" alt="Charon">
            <h3>Charon Client v2.0 [free]</h3>
            <p style="color:#444; font-size:0.7rem">Status: Working</p>
            <button class="btn-main btn-low" style="width:100%" onclick="openDetail('Charon Client v2.0 [free]', 'Working', 'no description', 'https://cdn.discordapp.com/attachments/1495783572735262911/1496170026158260364/image.png?ex=69e8e86b&is=69e796eb&hm=91c64bb8c69318d8c42565b0c38edd3cd55e8446622235632bbf522c5d280782&', 'https://www.mediafire.com/file/eia22kkv7a2n66u/Charon+2.0.zip/file')">info</button>
        </div>
    </div>
</div>

<div id="detail-page" class="container fade-in">
    <button onclick="location.reload()" style="background:none; border:none; color:#555; cursor:pointer; font-weight:bold; margin-bottom:20px">← Back to Tools</button>
    <div class="detail-grid">
        <div class="detail-info">
            <img id="det-img" src="" style="width:100%; border-radius:12px; margin-bottom:20px;">
            <h1 id="det-title" style="margin:0"></h1>
            <p id="det-desc" style="color:#777; line-height:1.6"></p>
        </div>
        <div class="detail-side">
            <p style="color:#444; font-size:0.7rem; margin-bottom:5px">Current Status</p>
            <div id="det-status" style="color:#3ecf8e; font-weight:bold; font-size:1.2rem"></div>
            <hr style="border:0; border-top:1px solid #1a1a1a; margin:25px 0">
            <div class="lock-ui">
                <button class="btn-red btn-low" onclick="document.getElementById('auth-overlay').style.display='flex'">please login to download</button>
            </div>
            <div class="auth-ui" style="display:none">
                <button id="det-dl" class="btn-main btn-low" style="width:100%">download tool</button>
            </div>
        </div>
    </div>
</div>

<div id="auth-overlay">
    <div class="auth-box fade-in" id="login-box">
        <h2>System Login</h2>
        <div class="input-group"><input type="email" id="log-email" placeholder="Email Address"></div>
        <div class="input-group">
            <input type="password" id="log-pass" placeholder="Password">
            <button class="eye-btn" onclick="togglePass('log-pass')">👁️</button>
        </div>
        <div id="log-error" class="error-msg"></div>
        <button class="btn-main" style="width:100%; margin-top:10px" onclick="login()">Sign In</button>
        <p style="color:#444; font-size:0.8rem; margin-top:20px; cursor:pointer" onclick="switchAuth('reg')">Don't have an account? <span style="color:var(--accent)">Create Account</span></p>
        <p style="color:#222; font-size:0.7rem; cursor:pointer; margin-top:15px" onclick="document.getElementById('auth-overlay').style.display='none'">Cancel</p>
    </div>

    <div class="auth-box fade-in" id="reg-box" style="display:none">
        <h2>Create Account</h2>
        <div class="input-group"><input type="email" id="reg-email" placeholder="Enter Email"></div>
        <div class="input-group">
            <input type="password" id="reg-pass" placeholder="Create Password">
            <button class="eye-btn" onclick="togglePass('reg-pass')">👁️</button>
        </div>
        <div id="reg-error" class="error-msg"></div>
        <button class="btn-main" style="width:100%; margin-top:10px" onclick="signUp()">Register</button>
        <p style="color:#444; font-size:0.8rem; margin-top:20px; cursor:pointer" onclick="switchAuth('log')">Already have an account? <span style="color:var(--accent)">Login here</span></p>
        <p style="color:#222; font-size:0.7rem; cursor:pointer; margin-top:15px" onclick="document.getElementById('auth-overlay').style.display='none'">Cancel</p>
    </div>
</div>

</body>
</html>
