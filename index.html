<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFN Archive | Pixel Worlds Tools</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCM-ySTXgy37zVUMB2vy4ZJQ3MWlDD5g4E",
            authDomain: "efn-archive.firebaseapp.com",
            projectId: "efn-archive",
            storageBucket: "efn-archive.firebasestorage.app",
            messagingSenderId: "1073610968306",
            appId: "1:1073610968306:web:72e03b6f43decbb636546b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // UI Helpers
        window.checkPass = () => {
            const pass = document.getElementById('pass').value;
            const msg = document.getElementById('m-msg');
            if (pass.length === 0) { msg.innerText = ""; return; }
            if (pass.length < 8 || !/\d/.test(pass)) {
                msg.innerText = "❌ invalid: 8+ chars & 1 number";
                msg.style.color = "#ff4444";
            } else {
                msg.innerText = "✅ password secure";
                msg.style.color = "#3ecf8e";
            }
        };

        window.signUp = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await sendEmailVerification(cred.user);
                alert("verification link sent! check your email and spam.");
            } catch (e) { alert(e.message); }
        };

        window.login = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                if (cred.user.emailVerified) { location.reload(); }
                else { alert("please verify your email first!"); }
            } catch (e) { alert("login failed - check credentials"); }
        };

        window.logout = () => signOut(auth).then(() => location.reload());

        // Page Transitions
        window.openDetail = (name, status, desc, img, link) => {
            const main = document.getElementById('main-page');
            const detail = document.getElementById('detail-page');
            
            main.classList.add('page-exit');
            setTimeout(() => {
                main.style.display = 'none';
                detail.style.display = 'block';
                detail.classList.add('page-enter');
                
                document.getElementById('det-title').innerText = name.toLowerCase();
                document.getElementById('det-status').innerText = status.toLowerCase();
                document.getElementById('det-desc').innerText = desc.toLowerCase();
                document.getElementById('det-img').src = img;
                document.getElementById('det-dl').onclick = () => window.open(link, '_blank');
                window.scrollTo(0,0);
            }, 300);
        };

        onAuthStateChanged(auth, (user) => {
            if (user && user.emailVerified) {
                document.getElementById('nav-guest').style.display = 'none';
                document.getElementById('nav-user').style.display = 'flex';
                document.getElementById('user-tag').innerText = user.email.split('@')[0];
                document.querySelectorAll('.lock-ui').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.auth-ui').forEach(el => el.style.display = 'block');
            }
        });
    </script>

    <style>
        :root { --bg: #030303; --card: #080808; --accent: #5865F2; --border: #121212; --red: #ff4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; overflow-x: hidden; }
        
        /* Animations */
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
        .page-enter { animation: slideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .page-exit { animation: slideOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); position: sticky; top:0; z-index: 1000; }
        
        .btn-solid { background: #fff; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: lowercase; transition: 0.2s; }
        .btn-solid:hover { transform: scale(1.05); background: var(--accent); color: #fff; }
        
        .btn-red { background: var(--red); color: #fff; padding: 15px; border-radius: 8px; font-weight: bold; border: none; width: 100%; cursor: pointer; text-transform: lowercase; }

        .container { max-width: 1100px; margin: 60px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 25px; transition: 0.4s; position: relative; text-align: center; }
        .card:hover { border-color: var(--accent); box-shadow: 0 10px 40px rgba(88, 101, 242, 0.05); }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 20px; border: 1px solid #1a1a1a; }

        .profile-area { position: relative; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .dropdown { position: absolute; top: 120%; right: 0; background: #0a0a0a; border: 1px solid var(--border); border-radius: 10px; width: 160px; display: none; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .profile-area:hover .dropdown { display: block; }
        .dropdown button { width: 100%; padding: 12px; background: none; border: none; color: #555; text-align: left; cursor: pointer; transition: 0.2s; text-transform: lowercase; }
        .dropdown button:hover { background: #111; color: #fff; }

        /* Detail View Layout */
        #detail-page { display: none; }
        .detail-layout { display: flex; gap: 50px; margin-top: 40px; flex-wrap: wrap; }
        .detail-content { flex: 2; }
        .detail-card { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 20px; flex: 1; height: fit-content; text-align: center; }
        #det-img { width: 100%; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; }

        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.96); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(10px); }
        .modal-box { width: 340px; background: #050505; padding: 40px; border-radius: 24px; border: 1px solid var(--border); text-align: center; }
        input { width: 100%; padding: 16px; margin: 10px 0; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 10px; outline: none; }
    </style>
</head>
<body>

<nav>
    <div style="font-weight:900; letter-spacing:3px; cursor:pointer" onclick="location.reload()">EFN ARCHIVE</div>
    <div style="display:flex; align-items:center; gap: 15px;">
        <a href="https://discord.gg/QV69upuxbg" target="_blank" style="text-decoration:none; color:var(--accent); font-weight:800; font-size:0.8rem; text-transform:lowercase;">discord</a>
        <div id="nav-guest">
            <button class="btn-solid" onclick="document.getElementById('auth-modal').style.display='flex'">login</button>
        </div>
        <div id="nav-user" style="display:none;" class="profile-area">
            <span id="user-tag" style="font-size:0.8rem; color:#444; text-transform:lowercase;"></span>
            <div style="width:30px; height:30px; background:var(--accent); border-radius:50%"></div>
            <div class="dropdown">
                <button onclick="alert('coming soon')">edit account</button>
                <button onclick="logout()" style="color:var(--red)">logout</button>
            </div>
        </div>
    </div>
</nav>

<div id="main-page" class="container page-enter">
    <h1 style="font-size: 3rem; margin-bottom: 10px; letter-spacing:-2px">pixel worlds tools</h1>
    <p style="color:#222; margin-bottom:50px; font-weight:bold">v2.1 • efn archive</p>
    
    <div class="grid">
        <div class="card">
            <img src="https://cdn.discordapp.com/attachments/1495783572735262911/1496170026158260364/image.png?ex=69e8e86b&is=69e796eb&hm=91c64bb8c69318d8c42565b0c38edd3cd55e8446622235632bbf522c5d280782&" alt="Charon">
            <h3 style="letter-spacing:1px; font-size:0.9rem">charon client v2.0 [free]</h3>
            <p style="color:#333; font-size:0.7rem; margin-bottom:20px">status: working</p>
            <button class="btn-solid" style="width:100%" onclick="openDetail('charon client v2.0 [free]', 'working', 'no description', 'https://cdn.discordapp.com/attachments/1495783572735262911/1496170026158260364/image.png?ex=69e8e86b&is=69e796eb&hm=91c64bb8c69318d8c42565b0c38edd3cd55e8446622235632bbf522c5d280782&', 'https://www.mediafire.com/file/eia22kkv7a2n66u/Charon+2.0.zip/file')">info</button>
        </div>
        
        <div class="card" style="opacity:0.3"><h3>coming soon</h3><p>...</p></div>
        <div class="card" style="opacity:0.3"><h3>coming soon</h3><p>...</p></div>
    </div>
</div>

<div id="detail-page" class="container">
    <button onclick="location.reload()" style="background:none; border:none; color:#333; cursor:pointer; font-weight:bold; text-transform:lowercase">← back to tools</button>
    <div class="detail-layout">
        <div class="detail-content">
            <img id="det-img" src="" alt="preview">
            <h1 id="det-title" style="font-size:2.5rem; margin:0; letter-spacing:-1px"></h1>
            <p id="det-desc" style="color:#555; margin-top:20px; line-height:1.6"></p>
        </div>
        <div class="detail-card">
            <p style="color:#333; font-size:0.7rem; text-transform:lowercase; margin-bottom:5px">current status</p>
            <div id="det-status" style="color:#3ecf8e; font-weight:900; font-size:1.4rem; text-transform:lowercase"></div>
            <hr style="border:0; border-top:1px solid #111; margin:30px 0">
            
            <div class="lock-ui">
                <button class="btn-red" onclick="document.getElementById('auth-modal').style.display='flex'">please login to download</button>
            </div>
            
            <div class="auth-ui" style="display:none">
                <button id="det-dl" class="btn-solid" style="width:100%">download tool</button>
            </div>
        </div>
    </div>
</div>

<div id="auth-modal">
    <div class="modal-box">
        <h2 style="text-transform:lowercase; letter-spacing:2px">system login</h2>
        <input type="email" id="email" placeholder="email">
        <input type="password" id="pass" placeholder="password" oninput="checkPass()">
        <p id="m-msg" style="font-size:0.7rem; margin:10px 0; min-height:1.2rem"></p>
        <button class="btn-solid" style="width:100%" onclick="login()">sign in</button>
        <p onclick="signUp()" style="color:#333; font-size:0.75rem; margin-top:20px; cursor:pointer">create account</p>
        <p onclick="document.getElementById('auth-modal').style.display='none'" style="color:#111; font-size:0.7rem; margin-top:10px; cursor:pointer">close</p>
    </div>
</div>

</body>
</html>
